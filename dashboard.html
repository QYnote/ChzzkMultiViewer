<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MultiStream</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      background: #0a0b0e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #e4e6ea;
      overflow: hidden;
    }

    /* ── 헤더 ── */
    header {
      height: 44px;
      background: #111318;
      border-bottom: 1px solid #1e2028;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      flex-shrink: 0;
      z-index: 100;
    }

    .logo {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.3px;
      white-space: nowrap;
    }

    .logo em {
      color: #00c73c;
      font-style: normal;
    }

    .header-divider {
      width: 1px;
      height: 16px;
      background: #2a2d38;
      flex-shrink: 0;
    }

    #sync-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      display: none;
    }

    #sync-badge.active {
      display: inline-block;
      background: rgba(0, 199, 60, 0.12);
      color: #00c73c;
      border: 1px solid rgba(0, 199, 60, 0.25);
    }

    .header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-text {
      font-size: 12px;
      color: #6b7280;
      white-space: nowrap;
    }

    .status-text strong {
      color: #e4e6ea;
      font-weight: 700;
    }

    /* ── 칸이 놓이는 바탕 ── */
    /* 방송 화면 상자는 여기에 절대 좌표로 놓인다. 자리만 옮기고 부모는 바꾸지 않는다. */
    .stage {
      position: relative;
      width: 100%;
      height: calc(100vh - 44px);
      overflow: hidden;
      background: #0a0b0e;
    }

    /* ── 방송 화면 상자 ── */
    .cell-box {
      position: absolute;
      background: #000;
      border: 1px solid #1e2028;
      border-radius: 4px;
      overflow: hidden;
    }

    .cell-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* ── 칸 사이 경계 ── */
    .layout-handle {
      position: absolute;
      z-index: 20;
      background: transparent;
      transition: background 0.1s;
    }

    .layout-handle.is-vertical   { cursor: col-resize; }
    .layout-handle.is-horizontal { cursor: row-resize; }
    .layout-handle:hover         { background: rgba(0, 199, 60, 0.35); }

    /* ── 칸 위에 얹히는 조작 화면 ── */
    /* opacity만 0으로 두면 보이지 않는 채로 클릭을 가로채 방송 조작을 막는다.
       visibility까지 함께 감춰야 마우스를 올렸을 때만 조작이 잡힌다. */
    .cell-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      /* 위쪽만 어둡게 깐다. 아래쪽은 방송 페이지의 조작 바 자리라 건드리지 않는다. */
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.72) 0%,
        transparent 40%
      );
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.15s, visibility 0.15s;
      pointer-events: none;
      z-index: 3;
    }

    .cell-box:hover .cell-overlay {
      opacity: 1;
      visibility: visible;
    }

    .cell-top {
      pointer-events: none;
    }

    .cell-name {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      padding: 7px 8px 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
    }

    /* ── 프로필 사진 (크기는 칸 높이의 1/4과 원본 중 작은 값으로 스크립트가 지정) ── */
    .cell-profile-img {
      position: absolute;
      top: 6px;
      left: 6px;
      border-radius: 50%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.15s;
      pointer-events: none;
      z-index: 4;
    }

    /* ── 채널 이름 태그 (항상 표시 모드 전용) ── */
    .cell-name-tag {
      position: absolute;
      top: 6px;
      left: 6px;
      max-width: calc(100% - 32px);
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      background: rgba(0, 0, 0, 0.55);
      padding: 2px 5px;
      border-radius: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
      z-index: 4;
      display: none;
    }

    /* ── 채널 표시 방식 ── */
    /* 항상 표시 (프로필 사진) */
    .stage[data-profile-display="always-profile"] .cell-profile-img { opacity: 1; }
    .stage[data-profile-display="always-profile"] .cell-name { display: none; }

    /* 항상 표시 (채널 이름) */
    .stage[data-profile-display="always-name"] .cell-profile-img { display: none; }
    .stage[data-profile-display="always-name"] .cell-name-tag { display: block; }
    .stage[data-profile-display="always-name"] .cell-name { display: none; }

    /* 마우스 올릴 때 (프로필 사진) */
    .stage[data-profile-display="hover-profile"] .cell-box:hover .cell-profile-img { opacity: 1; }
    .stage[data-profile-display="hover-profile"] .cell-name { display: none; }

    /* 마우스 올릴 때 (채널 이름): 오버레이의 채널명이 그대로 쓰인다 */
    .stage[data-profile-display="hover-name"] .cell-profile-img { display: none; }

    /* ── 방송이 없는 칸: 닫기 버튼을 계속 보여준다 ── */
    .cell-box.is-offline .cell-overlay { opacity: 1; visibility: visible; }

    /* ── 안내 ── */
    .offline-notice {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: #0d0e12;
      color: #6b7280;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      pointer-events: none;
      z-index: 2;
    }

    .init-notice {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(13, 14, 18, 0.85);
      color: #e5e7eb;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      pointer-events: none;
      z-index: 3;
    }

    .manual-wide-notice {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(13, 14, 18, 0.85);
      color: #e5e7eb;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
      padding: 0 12px;
      z-index: 3;
    }

    .manual-wide-notice .manual-wide-hint {
      font-size: 11px;
      font-weight: 400;
      color: #9ca3af;
    }

    .manual-wide-notice .btn-manual-refresh {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #e4e6ea;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .manual-wide-notice .btn-manual-refresh:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* ── 조작 줄 (우측 상단) ── */
    /* 방송 페이지의 조작 바가 화면 아래를 쓰므로 우리 조작은 전부 위로 모은다. */
    .cell-toolbar {
      position: absolute;
      top: 5px;
      right: 5px;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 5px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.15s, visibility 0.15s;
    }

    .cell-box:hover .cell-toolbar,
    .cell-box.is-offline .cell-toolbar,
    .cell-box.menu-open .cell-toolbar {
      opacity: 1;
      visibility: visible;
    }

    /* 방송이 없는 칸에서는 닫기만 남긴다 */
    .cell-box.is-offline .cell-latency-label,
    .cell-box.is-offline .btn-cell-refresh,
    .cell-box.is-offline .btn-cell-menu {
      display: none;
    }

    .cell-tool-btn {
      flex-shrink: 0;
      background: rgba(0, 0, 0, 0.55);
      border: none;
      color: #e4e6ea;
      width: 22px;
      height: 22px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.1s;
      line-height: 1;
    }

    .cell-tool-btn:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .btn-cell-grab {
      cursor: grab;
      font-size: 13px;
    }

    .btn-cell-grab:active {
      cursor: grabbing;
    }

    .btn-cell-remove:hover {
      background: rgba(220, 50, 50, 0.75);
      color: #fff;
    }

    .cell-latency-label {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.85);
      background: rgba(0, 0, 0, 0.55);
      padding: 3px 6px;
      border-radius: 4px;
      white-space: nowrap;
      line-height: 1.4;
      font-variant-numeric: tabular-nums;
    }

    .cell-menu {
      position: absolute;
      top: 32px;
      right: 5px;
      z-index: 6;
      display: none;
      flex-direction: column;
      min-width: 128px;
      padding: 4px;
      gap: 2px;
      background: rgba(17, 19, 24, 0.96);
      border: 1px solid #2a2d38;
      border-radius: 6px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
    }

    .cell-box.menu-open .cell-menu {
      display: flex;
    }

    .cell-menu-item {
      background: none;
      border: none;
      color: #c9cdd4;
      font-size: 11px;
      font-weight: 600;
      text-align: left;
      padding: 6px 8px;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
    }

    .cell-menu-item:hover {
      background: #2a2d38;
      color: #e4e6ea;
    }

    /* ── 영역 확대 ── */
    .zoom-drag-overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      cursor: crosshair;
      background: rgba(0, 0, 0, 0.25);
    }

    .zoom-drag-hint {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      pointer-events: none;
      white-space: nowrap;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
    }

    .zoom-drag-rect {
      position: absolute;
      border: 2px solid rgba(59, 158, 214, 0.9);
      background: rgba(59, 158, 214, 0.2);
      pointer-events: none;
      box-sizing: border-box;
    }

    .zoom-cancel-msg {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      z-index: 11;
      pointer-events: none;
      border-radius: 4px;
    }

    /* ── 자리 옮기기 ── */
    .cell-box.is-dragging {
      opacity: 0.45;
    }

    /* 놓을 자리 미리보기. 가장자리면 그쪽 절반, 가운데면 칸 전체를 덮는다 */
    .drop-indicator {
      position: absolute;
      z-index: 30;
      background: rgba(59, 158, 214, 0.3);
      border: 2px solid rgba(59, 158, 214, 0.9);
      border-radius: 4px;
      pointer-events: none;
    }

    .drop-indicator.is-swap {
      background: rgba(0, 199, 60, 0.25);
      border-color: rgba(0, 199, 60, 0.9);
    }

    /* 마우스를 따라다니는 채널 이름표 */
    .drag-ghost {
      position: fixed;
      z-index: 200;
      background: rgba(17, 19, 24, 0.95);
      border: 1px solid #2a2d38;
      color: #e4e6ea;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 4px;
      white-space: nowrap;
      pointer-events: none;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
    }

    /* ── 시청 목록이 비었을 때 ── */
    #empty-notice {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 10px;
      color: #374151;
    }

    #empty-notice .empty-icon {
      font-size: 36px;
      opacity: 0.5;
    }

    #empty-notice p {
      font-size: 12px;
      color: #4b5563;
      text-align: center;
      line-height: 1.7;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">Multi<em>Stream</em></div>
    <div class="header-divider"></div>
    <span id="sync-badge"></span>
    <div class="header-right">
      <span class="status-text">시청 중 <strong id="streamer-count">0</strong>채널</span>
    </div>
  </header>

  <!-- 방송 화면 상자와 칸 경계는 스크립트가 여기에 넣는다 -->
  <div class="stage" id="stage" data-profile-display="hover-name">
    <div id="empty-notice">
      <div class="empty-icon">📺</div>
      <p>팝업에서 스트리머를 추가하면<br>여기에 화면이 구성됩니다.</p>
    </div>
  </div>

  <script src="platforms/chzzk.js"></script>
  <script src="platforms/soop.js"></script>
  <script src="platforms/index.js"></script>
  <script src="dashboard/main.js"></script>
  <script src="dashboard/layout-tree.js"></script>
  <script src="dashboard/layout-view.js"></script>
  <script src="dashboard/layout-drag.js"></script>
  <script src="dashboard/panel.js"></script>
  <script src="dashboard/player.js"></script>
  <script src="dashboard/control.js"></script>
</body>
</html>
