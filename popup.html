<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>치지직 멀티뷰어 관리자</title>
  <style>
    /* 전체 레이아웃 가이드 (최대 800x600 범위 준수) */
    body {
      font-family: 'Malgun Gothic', sans-serif;
      margin: 0;
      padding: 10px;
      width: 420px;
      background-color: #f8f9fa;
      color: #333;
    }
    h2 { font-size: 16px; margin: 5px 0 15px 0; text-align: center; }

    /* 4개 탭 상단 네비게이션 스타일 */
    .tab-menu {
      display: flex;
      border-bottom: 2px solid #dee2e6;
      margin-bottom: 15px;
    }
    .tab-btn {
      flex: 1;
      padding: 8px 5px;
      font-size: 11px;
      font-weight: bold;
      text-align: center;
      background: #e9ecef;
      border: 1px solid #dee2e6;
      border-bottom: none;
      cursor: pointer;
      border-radius: 4px 4px 0 0;
      margin-right: 2px;
    }
    .tab-btn.active {
      background: #fff;
      border-color: #dee2e6;
      border-bottom: 2px solid #fff;
      color: #00c73c; /* 치지직 시그니처 테마색 느낌 */
      margin-bottom: -2px;
    }

    /* 탭 콘텐츠 기본 숨김 처리 */
    .tab-content { display: none; padding: 5px; min-height: 200px; }
    .tab-content.active { display: block; }

    /* 공통 UI 요소 스타일링 */
    .list-container {
      background: #fff;
      border: 1px solid #ced4da;
      border-radius: 4px;
      height: 180px;
      overflow-y: auto;
      padding: 5px;
      margin-bottom: 10px;
    }
    .input-group { margin-bottom: 10px; }
    .input-group label { display: block; font-size: 11px; margin-bottom: 3px; font-weight: bold; }
    .input-group input { width: 95%; padding: 6px; border: 1px solid #ced4da; border-radius: 4px; }
    
    button {
      width: 100%;
      padding: 8px;
      background-color: #00c73c;
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background-color: #00a832; }
    .btn-secondary { background-color: #6c757d; margin-top: 10px; }
    .btn-secondary:hover { background-color: #5a6268; }
  </style>
</head>
<body>

  <h2>🟢 치지직 멀티뷰어 제어판</h2>

  <!-- 4개 탭 버튼 영역 -->
  <div class="tab-menu">
    <button class="tab-btn active" data-tab="tab1">시청 목록</button>
    <button class="tab-btn" data-tab="tab2">즐겨찾기 관리</button>
    <button class="tab-btn" data-tab="tab3">스트리머 추가</button>
    <button class="tab-btn" data-tab="tab4">기타 설정</button>
  </div>

  <!-- 탭 1: 현재 시청 목록 -->
  <div id="tab1" class="tab-content active">
    <div class="list-container" id="current-view-list">
      <!-- 자바스크립트로 시청 중인 스트리머 아이템들이 렌더링될 곳 (WinForms의 ListBox 역할) -->
      <p style="color:#999; text-align:center; margin-top:70px; font-size:12px;">등록된 스트리머가 없습니다.</p>
    </div>
    <button id="btn-open-dashboard">🖥️ 멀티뷰 대시보드 열기</button>
  </div>

  <!-- 탭 2: 즐겨찾기 관리 (보관함) -->
  <div id="tab2" class="tab-content">
    <div class="list-container" id="favorite-master-list">
      <!-- 영구 보관된 즐겨찾기 스트리머들이 렌더링될 곳 -->
      <p style="color:#999; text-align:center; margin-top:70px; font-size:12px;">보관함이 비어 있습니다.</p>
    </div>
  </div>

  <!-- 탭 3: 스트리머 추가 (이원화 창구) -->
  <div id="tab3" class="tab-content">
    <!-- 수동 등록 파트 -->
    <div style="border-bottom: 1px dashed #ccc; padding-bottom: 10px; margin-bottom: 15px;">
      <h3 style="font-size:12px; margin: 0 0 10px 0; color:#00c73c;">📌 수동 ID 입력 등록</h3>
      <div class="input-group">
        <label>치지직 채널 고유 ID (32자리 난수)</label>
        <input type="text" id="input-channel-id" placeholder="예: 2b3c4d... 주소창에서 복사">
      </div>
      <div class="input-group">
        <label>스트리머 별명 / 식별용 이름</label>
        <input type="text" id="input-streamer-name" placeholder="예: 홍길동 라이브">
      </div>
      <button id="btn-add-manual">현재 시청 목록에 추가</button>
    </div>

    <!-- 팔로잉 연동 파트 -->
    <div>
      <h3 style="font-size:12px; margin: 0 0 10px 0; color:#00c73c;">🤝 치지직 팔로잉 연동</h3>
      <button id="btn-load-following" class="btn-secondary" style="margin-top:0;">내 팔로잉 목록 가져오기</button>
      <div id="following-sync-container" style="margin-top:10px; display:none;">
        <div class="list-container" id="following-api-list" style="height:220px;"></div>
      </div>
    </div>
  </div>

  <!-- 탭 4: 기타 설정 -->
  <div id="tab4" class="tab-content">
    <div class="input-group" style="display: flex; align-items: center; margin-top: 15px;">
      <input type="checkbox" id="chk-auto-sync" style="width: auto; margin-right: 10px;">
      <label for="chk-auto-sync" style="margin-bottom: 0; cursor: pointer;">방송 자동 동기화(새로고침) 활성화</label>
    </div>
    <div class="input-group" style="margin-top: 15px;">
      <label>기준 허용 지연 시간 (초)</label>
      <input type="number" id="num-limit-seconds" value="10" min="1" max="60" style="width: 60px; padding: 4px;">
    </div>
    <p style="font-size: 11px; color: #666; margin-top: 20px; line-height: 1.4;">
      * 추후 채팅창 위치 설정 및 언어 변경 옵션이 이곳에 추가될 예정입니다.
    </p>
    <div style="margin-top: 24px; padding: 10px; background: #f1f3f5; border-radius: 5px; border-left: 3px solid #ced4da;">
      <p style="font-size: 10px; color: #868e96; line-height: 1.7; margin: 0;">
        1. 본 확장프로그램은 Naver의 정보수집 방해 또는 삭제 요청 시 삭제될 수 있습니다.<br>
        2. 본 프로그램 개발 목적은 단순히 '여러 동시화면 보기 위함'이며 그 외의 목적은 없음을 알려드립니다.<br>
        3. 본 프로그램은 웹개발을 모르는 타언어 개발자가 Claude Code Pro를 이용하여 개발하였습니다.
      </p>
    </div>
  </div>

  <!-- 로직 연결용 스크립트 파일 매핑 -->
  <script src="popup.js"></script>
</body>
</html>
